          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Install dependencies
        run: flutter pub get

      # Writes android/key.properties + the keystore from repository secrets so
      # the release APK is signed with a stable key. Without the secrets (a fork
      # PR cannot read them) the build falls back to the debug key, which is
      # regenerated per runner -- fine for a throwaway build, but such an APK
      # will not install over a properly signed one.
      - name: Set up Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - this APK will be signed with a throwaway debug key and will not install over a release-signed build."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not. Set both, or neither."
            exit 1
          fi
          # Only the keystore and its password are required. keytool lets one
          # password cover both the store and the key, and the alias is fixed
          # by convention, so the other two secrets are optional overrides for
          # a keystore that was created with different values.
          KEY_ALIAS="${KEY_ALIAS:-playtorriomov}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # storeFile is resolved relative to the android/app module directory.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured (alias: $KEY_ALIAS)."

      - name: Build Universal APK
        run: flutter build apk --release --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}

      - name: Organize Universal APK
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p android_apks
          cp build/app/outputs/flutter-apk/app-release.apk \
            "android_apks/PlayTorrioMov-$APP_VERSION-Android-Universal.apk"

      - name: Upload Android Universal Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-Android-Universal
          path: android_apks/*.apk
          if-no-files-found: error

  # ─── Linux x64 Build (AppImage & Tar.gz) ──────────────────────────────────
  linux-x64:
    name: Linux x64 (AppImage & Tar)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          # Ported from upstream's db2a4b9 + 0343720. The ubuntu-latest
          # image ships a dl.google.com apt source that periodically breaks
          # `apt-get update`, failing the build for a repository none of
          # these packages come from. Purge it, and let update fail soft --
          # a genuinely missing package still fails loudly at install.
          sudo grep -rl "dl.google.com" /etc/apt/ 2>/dev/null | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -y || true
          sudo apt-get install -y \
            clang lld cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev xvfb \
            libboost-all-dev libssl-dev libgcrypt20-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Generate Linux platform files if missing
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      # Works around a Flutter 3.44.0 CMake bug (flutter/flutter#159199):
      # cmake_install.cmake unconditionally tries to `file(INSTALL
      # DIRECTORY build/native_assets/linux ...)`, which errors if that
      # directory doesn't exist at all -- it's only created when a package
      # actually declares a native-asset build hook, which none here do.
      # Pre-creating it empty makes that install step a no-op instead of a
      # hard failure.
      - name: Work around missing native_assets directory
        run: mkdir -p build/native_assets/linux

      - name: Build Linux Release
        run: flutter build linux --release --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}

      - name: Package as AppImage & Tar
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          APP=PlayTorrioMov.AppDir
          mkdir -p "$APP"
          cp -r build/linux/x64/release/bundle/* "$APP/"

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "$APP/PlayTorrioMov.png"
          elif [ -f "icon.png" ]; then
            cp icon.png "$APP/PlayTorrioMov.png"
          else
            touch "$APP/PlayTorrioMov.png"
          fi

          cat <<EOF > "$APP/PlayTorrioMov.desktop"
          [Desktop Entry]
          Name=PlayTorrioMov
          Exec=AppRun
          Icon=PlayTorrioMov
          Type=Application
          Categories=AudioVideo;Audio;Video;Player;
          EOF

          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./PlayTorrioMov "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" "PlayTorrioMov-$APP_VERSION-Linux-x86_64.AppImage"
          tar -czvf "PlayTorrioMov-$APP_VERSION-Linux-x86_64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-Linux-x64
          path: |
            PlayTorrioMov-*-Linux-x86_64.AppImage
            PlayTorrioMov-*-Linux-x86_64.tar.gz

      - name: Upload Linux Bundle (raw, for the Flatpak job)
        uses: actions/upload-artifact@v6
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle/*
          if-no-files-found: error

  # ─── Linux x64 Build (Flatpak) ────────────────────────────────────────────
  # Wraps the same bundle built above rather than rebuilding from source -
  # flatpak-builder's sandbox has no network access, so `flutter pub get`
  # can't run inside it without a separate offline-cache setup. See
  # flatpak/io.github.MediaHubOrg.PlayTorrioMov.json for the manifest.
  linux-flatpak:
    name: Linux x64 (Flatpak)
    needs: [version, linux-x64]
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: linux-bundle
          path: bundle

      - name: Fix bundle executable permissions
        run: chmod +x bundle/PlayTorrioMov

      - name: Stamp version into Flatpak metainfo
        # A hand-written <release version="..."> goes stale the moment it's
        # not the version being built -- it already had, showing 1.3.0 while
        # v1.5.0 was installing. Stamped from the same resolved version
        # every other platform's filename already uses.
        run: |
          sed -i \
            "s|<release version=\"[^\"]*\" date=\"[^\"]*\" />|<release version=\"${{ needs.version.outputs.version }}\" date=\"$(date -u +%Y-%m-%d)\" />|" \
            flatpak/io.github.MediaHubOrg.PlayTorrioMov.metainfo.xml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PlayTorrioMov-${{ needs.version.outputs.version }}-Linux-x86_64.flatpak
          manifest-path: flatpak/io.github.MediaHubOrg.PlayTorrioMov.json
          # Keyed on github.sha before, which is unique per commit -- so the
          # cache never actually hit, and every release re-downloaded the
          # Freedesktop SDK/Platform runtimes and rebuilt libsecret from
          # source from nothing (confirmed in a real run's logs: "No cache
          # was found"). Neither changes unless the manifest itself does, so
          # keying on the manifest's own hash lets flatpak-builder's ccache
          # skip all of that on every release that doesn't touch it.
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.MediaHubOrg.PlayTorrioMov.json') }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-Linux-Flatpak
          path: PlayTorrioMov-*-Linux-x86_64.flatpak
          if-no-files-found: error

  # ─── macOS Build (Universal: Apple Silicon + Intel) ──────────────────────
  #
  #  One job, not two. `flutter build macos` emits a universal binary -- the
  #  .app's Mach-O carries both the arm64 and the x86_64 slice -- so a second
  #  job under Rosetta produced an app with exactly the same two slices. The
  #  two ZIPs it shipped in v1.6.2 were byte-for-byte the same size, differing
  #  only in ad-hoc signature; the "Intel" download was not an Intel build,
  #  it was the same universal app under a name that promised a choice which
  #  did not exist. That job cost ~14 minutes and was the release's long pole.
  #
  #  The `lipo` check below is what keeps the "universal" name honest: if a
  #  future Flutter emits a single-slice binary, the build fails here rather
  #  than publishing an arm64-only app to Intel Macs.
  macos:
    name: macOS (Universal)
    needs: [version]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Configure macOS platform files if missing
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}

      - name: Verify the binary is universal
        run: |
          BIN=build/macos/Build/Products/Release/PlayTorrioMov.app/Contents/MacOS/PlayTorrioMov
          ARCHS=$(lipo -archs "$BIN")
          echo "Architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "::error title=macOS build is not universal::Expected both arm64 and x86_64 in $BIN, got '$ARCHS'. The release calls this artifact 'universal', so publishing it now would ship a single-architecture app to every Mac. Either restore a second per-architecture job or rename the artifact." >&2; exit 1 ;;
            esac
          done

      - name: Package as DMG & ZIP
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd build/macos/Build/Products/Release

          codesign --sign - --force --deep PlayTorrioMov.app

          mkdir -p dmg_temp
          cp -R PlayTorrioMov.app dmg_temp/
          ln -s /Applications dmg_temp/Applications

          sync
          sleep 2

          for i in {1..3}; do
            hdiutil create -volname "PlayTorrioMov" -srcfolder dmg_temp -ov -format UDZO "../../../../../PlayTorrioMov-$APP_VERSION-macOS-universal.dmg" && break || sleep 3
          done
          zip -ry "../../../../../PlayTorrioMov-$APP_VERSION-macOS-universal.zip" PlayTorrioMov.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-macOS
          path: |
            PlayTorrioMov-*-macOS-universal.dmg
            PlayTorrioMov-*-macOS-universal.zip

  # ─── iOS Build (Sideloadable IPA — no-codesign) ───────────────────────────
  ios:
    name: iOS (IPA)
    needs: [version]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
