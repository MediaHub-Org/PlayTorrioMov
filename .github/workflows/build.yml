# ──────────────────────────────────────────────────────────────────────────────
#  PlayTorrioMov — Multi-Platform CI/CD Release Builder
#
#  Builds:
#    - Windows: Installer (Inno Setup) & Portable ZIP (x64)
#    - Android: Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64) & Universal APK
#    - Linux: AppImage & Tar.gz (x86_64)
#    - macOS: Universal (arm64 + x86_64) DMG & ZIP -- one build serves both
#    - iOS: Sideloadable IPA (no-codesign)
#  Trigger: Git tag push (v*) or Manual Workflow Dispatch
#
#  Manual dispatch has two modes:
#    - release_tag empty -> build all platforms, upload artifacts only.
#      Use this to check every platform still compiles.
#    - release_tag set   -> additionally publish those builds under that
#      tag (e.g. v1.1.3), so testers get download links instead of CI
#      artifacts (which require a GitHub login and expire).
#  Dispatched builds are marked as GitHub *prereleases* and titled
#  "(dev)" while they are untested -- clear `dev_build` once a build has
#  been verified on a device. A tag carrying a semver prerelease suffix
#  (v1.2.0-beta.1) is a prerelease too, pushed or dispatched; a plain
#  v1.2.0 is a full release. See APP_CHANNEL below, which is where that
#  one decision is made for the binaries and the release alike.
#  Environment: Injects --dart-define-from-file=.env using ${{ secrets.ENV_FILE }},
#  plus --dart-define=APP_CHANNEL so the binary carries the same dev/stable
#  marker as the release it ships in.
# ──────────────────────────────────────────────────────────────────────────────
name: Build and Release PlayTorrioMov

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v1.1.3). Leave empty to only upload build artifacts.'
        required: false
        default: ''
      dev_build:
        description: 'Untested build: title it "(dev)" and publish as a prerelease.'
        type: boolean
        required: false
        default: true

# Two runs publishing the same tag would race on creating it and on
# uploading assets to it. Queue them instead -- and never cancel in
# progress: a half-finished release upload is worse than a slow one, and
# unlike a superseded PR check there is nothing redundant about a release
# build that is already most of the way through seven platforms.
concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

# The pub cache steps below reference ${{ env.PUB_CACHE }}. It has to be set
# here or it expands to an empty string, and the cache silently stores only
# .dart_tool -- which is why `flutter pub get` re-downloaded the media_kit git
# dependencies on every job of every run. Dart honours PUB_CACHE on all three
# runner OSes, so one workflow-level value covers every job.
env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  # Build channel baked into the binary via AppInfo.channel, so an
  # unverified build says "1.4.0 (dev)" in Settings/About and shows the
  # prerelease badge. This is the ONE place the dev/stable decision is made:
  # the Publish job derives both the release title and its `prerelease` flag
  # from `env.APP_CHANNEL`, so the marker inside the app cannot disagree with
  # the label outside it. It used to be a hardcoded constant in app_info.dart
  # that a human was expected to flip by hand each release, which meant a
  # dev_build dispatch published binaries claiming to be verified.
  #
  # A build is 'dev' when either:
  #   - it is a manual dispatch that did not explicitly clear `dev_build`, or
  #   - the tag being published carries a semver prerelease suffix
  #     (v1.2.0-rc.1), whether that tag was pushed or named in the dispatch.
  # The event_name guards matter. `github.event.inputs.dev_build` is an empty
  # string on a tag push, so the old bare `!= 'false'` was true there too and
  # a plain `v1.2.0` tag published as a prerelease titled "(dev)" -- the exact
  # opposite of what the comment below it promised. And `github.ref_name` is a
  # *branch* name on a dispatch, so testing it for '-' made every build from a
  # branch like `claude/fix-thing` dev regardless of the flag.
  APP_CHANNEL: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.dev_build != 'false') || (github.event_name == 'push' && contains(github.ref_name, '-')) || contains(github.event.inputs.release_tag, '-')) && 'dev' || '' }}

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Resolve version once ──────────────────────────────────────────────────
  # Every platform job stamps its own artifact filenames with this so two
  # different releases downloaded into the same folder (e.g. Downloads) don't
  # silently overwrite each other under an identical name.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version string
        id: resolve
        shell: bash
        run: |
          # Prefer the dispatched release tag, then a pushed v* tag. On a
          # plain dispatch github.ref_name is a branch name ("main"), which
          # is not a version -- fall back to pubspec.yaml so artifacts never
          # advertise a branch as their version.
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          clean="${tag#v}"
          if ! [[ "$clean" =~ ^[0-9]+\.[0-9]+ ]]; then
            clean=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')
          fi
          echo "Resolved version: $clean"
          echo "version=$clean" >> "$GITHUB_OUTPUT"

  # ─── Windows Build ────────────────────────────────────────────────────────
  windows:
    name: Windows (Installer & Portable)
    needs: [version]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        shell: bash
        run: |
          # flutter_inappwebview_windows uses <experimental/coroutine>, which
          # newer MSVC (VS 2026 / STL1011) treats as a hard error. Silence the
          # deprecation so the plugin compiles on the CI runner.
          export CXXFLAGS="-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

          # The generated cmake_install.cmake unconditionally installs
          # build/native_assets/windows, even though this app has no native
          # (FFI) assets to populate it -- Dart's native-assets build step
          # never creates the directory when there is nothing for it to
          # build. CMake's `file(INSTALL ...)` then fails with "cannot find
          # ...: No error", which is what the verbose re-run below was added
          # to surface in the first place. Pre-create it so the directory
          # exists (empty) either way.
          mkdir -p build/native_assets/windows

          if flutter build windows --release --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}; then
            exit 0
          fi

          # `flutter build` summarises MSBuild's output, so an INSTALL.vcxproj
          # failure surfaces only as MSB3073 wrapping the cmake_install.cmake
          # command line -- the actual reason (a missing file to copy, a
          # locked target, no space) never reaches the log. That is exactly
          # how the v1.4.0 release build failed twice with nothing to act on.
          #
          # Re-run just the failing target verbosely to print it, then still
          # fail the step. Costs nothing on a successful build.
          echo "::group::Re-running the INSTALL target to surface the real error"
          cmake --build build/windows/x64 --config Release --target INSTALL --verbose 2>&1 | tail -80 || true
          echo "::endgroup::"
          exit 1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "PATH refreshed for Inno Setup."

      - name: Compile Inno Setup Installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanVersion = $env:APP_VERSION
          Write-Host "Installer version: $cleanVersion"

          $isccCmd = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $isccCmd) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $isccCmd = $candidate
                break
              }
            }
          }
          if (-not $isccCmd) {
            throw "ISCC compiler executable could not be found!"
          }
          Write-Host "Using Inno Setup Compiler at: $isccCmd"

          New-Item -ItemType Directory -Force -Path "installer\windows\Output"

          & $isccCmd /DMyAppVersion=$cleanVersion installer\windows\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          $outExe = "PlayTorrioMov-$cleanVersion-Windows-Setup.exe"
          if (Test-Path "installer\windows\Output\PlayTorrioMov-Windows-Setup.exe") {
            Copy-Item "installer\windows\Output\PlayTorrioMov-Windows-Setup.exe" ".\$outExe" -Force
            Write-Host "Verified and copied $outExe to root."
          } else {
            throw "PlayTorrioMov-Windows-Setup.exe was not found in Output directory after ISCC compile!"
          }

      - name: Package Portable ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PlayTorrioMov-$($env:APP_VERSION)-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-Windows
          path: |
            PlayTorrioMov-*-Windows-Setup.exe
            PlayTorrioMov-*-Windows-x64-Portable.zip

  # ─── Android Build (Split-per-ABI APKs) ────────────────────────────────────
  # The universal APK is built by the `android-universal` job below rather than
  # here: two release builds in one job ran back to back for ~13 min, and since
  # Android is the workflow's long pole that set the whole run's wall time.
  # Two ubuntu jobs cost the same minutes but finish in half the time.
  android:
    name: Android (Split-per-ABI APKs)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Install dependencies
        run: flutter pub get

      # Writes android/key.properties + the keystore from repository secrets so
      # the release APK is signed with a stable key. Without the secrets (a fork
      # PR cannot read them) the build falls back to the debug key, which is
      # regenerated per runner -- fine for a throwaway build, but such an APK
      # will not install over a properly signed one.
      - name: Set up Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - this APK will be signed with a throwaway debug key and will not install over a release-signed build."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not. Set both, or neither."
            exit 1
          fi
          # Only the keystore and its password are required. keytool lets one
          # password cover both the store and the key, and the alias is fixed
          # by convention, so the other two secrets are optional overrides for
          # a keystore that was created with different values.
          KEY_ALIAS="${KEY_ALIAS:-playtorriomov}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # storeFile is resolved relative to the android/app module directory.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured (alias: $KEY_ALIAS)."

      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}

      - name: Organize Android APK Outputs
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p android_apks
          APK_DIR="build/app/outputs/flutter-apk"

          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" "android_apks/PlayTorrioMov-$APP_VERSION-Android-arm64-v8a.apk"
          fi
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" "android_apks/PlayTorrioMov-$APP_VERSION-Android-armeabi-v7a.apk"
          fi
          if [ -f "$APK_DIR/app-x86_64-release.apk" ]; then
            cp "$APK_DIR/app-x86_64-release.apk" "android_apks/PlayTorrioMov-$APP_VERSION-Android-x86_64.apk"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-Android
          path: android_apks/*.apk
          if-no-files-found: error

  # ─── Android Universal APK ─────────────────────────────────────────────────
  # Runs alongside the split-per-ABI job rather than after it; see that job's
  # comment. Kept as a separate artifact so the release picks up both.
  android-universal:
    name: Android (Universal APK)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
