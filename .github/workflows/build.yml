            .dart_tool
          key: ${{ runner.os }}-ios-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-pub-

      - name: Setup .env from GitHub Secrets
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          elif [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
          else
            # An empty .env still builds, which is why this went unnoticed:
            # every credential-backed feature simply no-ops in the artifact.
            # Say so loudly rather than shipping a release that silently
            # cannot sign in to anything.
            touch .env
            echo "::warning title=Building without credentials::No ENV_FILE or DOTENV secret is set, so .env is empty. Trakt and Simkl sign-in and Discord Rich Presence are inert in this build. TMDB cast photos are off too, now that the dead source-committed key is gone -- set TMDB_API_KEY in ENV_FILE, or each user adds their own under Settings. See docs/RELEASES.md for the keys .env is read for."
          fi
          # `--dart-define-from-file` needs every line to read KEY=VALUE. When
          # one does not, Flutter says `Invalid property line: ***` -- the
          # content is a secret, so the message names nothing anyone can act
          # on. Name the line number instead, and normalise what is safely
          # normalisable.
          if [ -s .env ]; then
            sed -i 's/\r$//' .env
            bad=$(awk 'NF && $0 !~ /^[[:space:]]*#/ && $0 !~ /=/ { printf "%s ", NR }' .env)
            if [ -n "$bad" ]; then
              echo "::error title=ENV_FILE is not KEY=VALUE::Line(s) ${bad}of the secret contain no '='. Every line must read KEY=VALUE; blank lines and # comments are fine. The content is masked in logs, so check the secret itself -- see docs/RELEASES.md for the keys it is read for."
              exit 1
            fi
            awk 'NF && $0 !~ /^[[:space:]]*#/' .env > .env.tmp
            mv .env.tmp .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env --dart-define=APP_CHANNEL=${{ env.APP_CHANNEL }}

      - name: Package as IPA
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -ry "../../../PlayTorrioMov-$APP_VERSION-iOS.ipa" Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlayTorrioMov-iOS
          path: PlayTorrioMov-*-iOS.ipa

  # ─── Create / Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [windows, android, android-universal, linux-x64, linux-flatpak, macos, ios]
    # Publishes for a pushed v* tag, or for a manual dispatch that named a
    # release tag. Still requires every platform to have built: a half-published
    # release is worse than none, and each job's artifacts remain downloadable
    # from the run either way.
    if: |
      success() && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event.inputs.release_tag != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          # Generate a SHA256SUMS file for every release asset so users can
          # verify download integrity. The checksum file itself is uploaded.
          sha256sum *.exe *.zip *.apk *.AppImage *.tar.gz *.dmg *.ipa *.flatpak 2>/dev/null \
            > SHA256SUMS || true
          if [ ! -s SHA256SUMS ]; then
            echo "No release assets found to checksum." >&2
            exit 1
          fi
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          # On a dispatch the tag comes from the input and is created at the
          # dispatched ref; on a tag push it is the pushed tag.
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "PlayTorrioMov ${{ github.event.inputs.release_tag || github.ref_name }}${{ env.APP_CHANNEL == 'dev' && ' (dev)' || '' }}"
          draft: false
          # Both of these read the channel resolved once at the top of the
          # workflow, so the badge on the release, the "(dev)" in its title and
          # the channel compiled into every binary it ships can never disagree.
          # A dev dispatch is a prerelease, as is any tag carrying a semver
          # prerelease suffix (v1.2.0-rc.1). Plain v1.2.0 ships as full.
          prerelease: ${{ env.APP_CHANNEL == 'dev' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.exe
            *.zip
            *.apk
            *.AppImage
            *.tar.gz
            *.dmg
            *.ipa
            *.flatpak
            SHA256SUMS
