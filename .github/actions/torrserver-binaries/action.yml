name: Stage TorrServer binaries
description: >
  Fetches the TorrServer binaries a desktop or iOS build needs from this repo's
  torrserver-MatriX.147 release, checks each against a pinned SHA-256, and
  points TORRSERVER_FLUTTER_LOCAL_BINARIES at them. The torrserver_flutter
  plugin then uses these instead of downloading from its own upstream repo,
  which no longer exists. The download goes through `gh` with the workflow's
  own token: the repo is private, so an anonymous curl gets a 404.

inputs:
  platforms:
    description: 'Space-separated: any of linux, windows, darwin, ios.'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP//\\//}/torrserver"
        mkdir -p "$dest"

        fetch() {
          local name="$1" sum="$2" attempt
          for attempt in 1 2 3; do
            if gh release download torrserver-MatriX.147 --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$dest" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not download $name from the torrserver-MatriX.147 release"
              return 1
            fi
            sleep 5
          done
          echo "$sum  $dest/$name" | sha256sum -c --quiet -
        }

        for platform in $PLATFORMS; do
          case "$platform" in
            linux)
              fetch torrserver-linux-amd64 2f20fcb1fcacc9b61b7ca4bb6d5b7933547bd7f447b5cc77a84406faa9e6a4e8 ;;
            windows)
              fetch torrserver-windows-amd64.exe 2a67f19266f111f00828857e7e37c233a509c0def4f6254fd564a1761f35b47d ;;
            darwin)
              fetch torrserver-darwin-amd64 5cf02d76b6037a6a0f0cf8bafda0a9dbe34fb10149aed998f422cb26f7225608
              fetch torrserver-darwin-arm64 3e13a04e5e9e9bee044b15829fa13769c7c385bc71e8227f010434e1038ef172 ;;
            ios)
              fetch TorrServerKit.xcframework.zip c3134357b17cfdced821cbbbeb1936da1b653d03ca5cf9a349e1adb146ceab9f
              unzip -q "$dest/TorrServerKit.xcframework.zip" -d "$dest"
              rm "$dest/TorrServerKit.xcframework.zip" ;;
            *)
              echo "::error::unknown TorrServer platform '$platform'"
              exit 1 ;;
          esac
        done

        echo "TORRSERVER_FLUTTER_LOCAL_BINARIES=$dest" >> "$GITHUB_ENV"
