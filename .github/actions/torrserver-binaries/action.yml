name: Stage TorrServer binaries
description: >
  Fetches the TorrServer binaries a desktop or iOS build needs from this repo's
  torrserver-MatriX.148 release, checks each against a pinned SHA-256, and
  points TORRSERVER_FLUTTER_LOCAL_BINARIES at them. The torrserver_flutter
  plugin then uses these instead of downloading from its own upstream repo,
  which no longer exists. The download goes through `gh` with the workflow's
  own token, so it works whether or not the release is public.

inputs:
  platforms:
    description: 'Space-separated: any of linux, windows, darwin, ios.'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP//\\//}/torrserver"
        mkdir -p "$dest"

        fetch() {
          local name="$1" sum="$2" attempt
          for attempt in 1 2 3; do
            if gh release download torrserver-MatriX.148 --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$dest" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not download $name from the torrserver-MatriX.148 release"
              return 1
            fi
            sleep 5
          done
          echo "$sum  $dest/$name" | sha256sum -c --quiet -
        }

        for platform in $PLATFORMS; do
          case "$platform" in
            linux)
              fetch torrserver-linux-amd64 1ae142a048d894b74f35e3b989ea83549f6e2da67484dbd715af9fd0dfe351fb ;;
            windows)
              fetch torrserver-windows-amd64.exe 2173e118f551f7a0b192afa5bfcac00dba3c845d8edd1f590a5d1ea539773019 ;;
            darwin)
              fetch torrserver-darwin-amd64 edfdc4c7f43f64040900efa383092f25bc023bcb16435361967c87a7a5e8f4af
              fetch torrserver-darwin-arm64 e671318df28d6a0f7b5784e693c7e60170db74e47b8f626edebb4b6860cf4283 ;;
            ios)
              fetch TorrServerKit.xcframework.zip 20a26c413d850952cec10b235d504496d333bfb1b6aa738aad0e522573d635b3
              unzip -q "$dest/TorrServerKit.xcframework.zip" -d "$dest"
              rm "$dest/TorrServerKit.xcframework.zip" ;;
            *)
              echo "::error::unknown TorrServer platform '$platform'"
              exit 1 ;;
          esac
        done

        echo "TORRSERVER_FLUTTER_LOCAL_BINARIES=$dest" >> "$GITHUB_ENV"
