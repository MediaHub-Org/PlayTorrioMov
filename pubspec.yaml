name: playtorrio
description: "All-in-one media streaming app — movies, series, manga, audiobooks, and music. Powered by Stremio addons, torrent streaming, and the open web."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.3+11

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  html: ^0.15.5
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  torrserver_flutter: ^0.0.5
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 11d02cb804b8faf944137834a1b0ac80880a4079
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 11d02cb804b8faf944137834a1b0ac80880a4079
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 11d02cb804b8faf944137834a1b0ac80880a4079
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_windows_video: ^1.0.11
  video_player: ^2.11.1
  archive: ^4.0.9
  path_provider: ^2.1.6
  liquid_glass_easy: ^4.1.1
  ota_update: ^7.1.0
  package_info_plus: ^8.3.1
  path: ^1.9.0
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  xml: ^7.0.1
  flutter_inappwebview: ^6.1.5
  wakelock_plus: ^1.3.3
  window_manager: ^0.5.2
  file_picker: ^8.1.7
  audio_service: ^0.18.19
  # Discord Rich Presence, from upstream v1.0.8. The other four packages that
  # arrived with it (pdfrx, dart_mobi, fb2_parse,
  # flutter_widget_from_html_core) back upstream's PDF/MOBI/FB2 reader pages,
  # which this fork does not have -- its Read hub is EPUB-only. See ROADMAP.
  dart_discord_presence: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_secure_storage_platform_interface: ^2.0.3
  # Used directly by backup_service_test to stub the platform channel.
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_linux:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/linux/media_kit_libs_linux
  media_kit_libs_ios_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/ios/media_kit_libs_ios_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/android/media_kit_libs_android_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/windows/media_kit_libs_windows_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/macos/media_kit_libs_macos_video
  media_kit_libs_ohos:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: ./libs/ohos/media_kit_libs_ohos

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  linux:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon.png
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
