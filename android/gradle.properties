org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# NOTE: do not commit an `org.gradle.java.home` here. A machine-specific JDK
# path breaks the build for everyone else (and for CI) -- set JAVA_HOME, or
# put the override in your own untracked android/local.properties instead.

# Kotlin's incremental-compilation cache relativizes paths between the pub
# cache (usually C:) and this project (may be on a different drive letter,
# e.g. D:) -- that throws "this and base files have different roots" when
# closing its lookup caches. Harmless (the build still completes) but noisy
# and surfaces as a false build error in IDE Gradle integrations. Disabling
# incremental compilation avoids it entirely.
kotlin.incremental=false
